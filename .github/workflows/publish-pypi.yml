name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag (for example v0.1.0)
        required: true
        type: string

permissions: {}

concurrency: pypi-publish

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stream-clipping-cli/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package distributions from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vX.Y.Z." >&2
            exit 1
          fi
          published_tag=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then "" else .tagName end')
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo "Select a published stable GitHub release." >&2
            exit 1
          fi
          version=${RELEASE_TAG#v}
          wheel="stream_clipping_cli-${version}-py3-none-any.whl"
          sdist="stream_clipping_cli-${version}.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "$wheel" --pattern "$sdist"
          test -s "dist/$wheel"
          test -s "dist/$sdist"

      - name: Publish the distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
