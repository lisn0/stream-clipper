name: Publish to PyPI and npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag (for example v0.1.0)
        required: true
        type: string

permissions: {}

concurrency: pypi-publish

jobs:
  pypi:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stream-clipper/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package distributions from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vX.Y.Z." >&2
            exit 1
          fi
          published_tag=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then "" else .tagName end')
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo "Select a published stable GitHub release." >&2
            exit 1
          fi
          version=${RELEASE_TAG#v}
          wheel="stream_clipper-${version}-py3-none-any.whl"
          sdist="stream_clipper-${version}.tar.gz"
          npm_archive="stream-clipper-${version}.tgz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$npm_archive"
          tar -xOzf "$npm_archive" package/package.json |
            jq -e --arg name "stream-clipper" --arg version "$version" \
              '.name == $name and .version == $version' >/dev/null
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "$wheel" --pattern "$sdist"
          test -s "dist/$wheel"
          test -s "dist/$sdist"

      - name: Publish the distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download and publish the npm launcher with Trusted Publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          archive="stream-clipper-${version}.tgz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive"
          npm publish "./$archive" --access public --ignore-scripts
