[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-clipper"
version = "0.1.0"
description = "Cut local clips from live Twitch streams using chat spikes and browse them through MCP."
keywords = ["twitch", "twitch-chat", "stream-clipping", "live-streaming", "ffmpeg", "mcp"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/lisn0/stream-clipper"
Issues = "https://github.com/lisn0/stream-clipper/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
stream-clipping = "stream_clipper.live_monitor:main"
stream-clipping-mcp = "stream_clipper.clip_mcp:main"
stream-clipping-postfling = "stream_clipper.push_to_postfling:main"

[tool.setuptools]
packages = ["stream_clipper"]
package-dir = { stream_clipper = "pipeline" }
